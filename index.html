<!DOCTYPE html>
<html lang="en"><head>

<!-- MW brand fonts (Khand headings, Hind body; tokens from maxweberman.com brand-tokens.css) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Hind:wght@400;500;600;700&display=swap">
<style id="mw-brand-fonts">
:root{--mw-font-heading:"Khand","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mw-font-body:"Hind",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
html body,html body :where(*:not(code,pre,kbd,samp)){font-family:var(--mw-font-body)!important}
html body :is(h1,h2,h3,h4,h5,h6),html body :is(h1,h2,h3,h4,h5,h6) :where(*:not(code)){font-family:var(--mw-font-heading)!important;font-weight:700;letter-spacing:0}
</style>

<!--mw-polish--><style id="mw-polish">
/* MW polish layer: /workspace/ops/brand/app-polish-spec.md (Oct 10, 2026). Light mode, brand motion, 44px targets. */
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms;--mw-ink:#171717;--mw-grey:#737373;--mw-line:#E5E5E5;--mw-jungle:#0B6E4F;--mw-lagoon:#05668D;--mw-terra:#C1502E}
html{color-scheme:light only}
:where(button,.btn,a.btn,[role=button]){transition:translate var(--mw-dur) var(--mw-ease),scale var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
@media (hover:hover){:where(button,.btn,a.btn):not(:disabled):not(.leaflet-container *):hover{translate:0 -1px;scale:1.03;box-shadow:0 6px 18px rgba(10,10,10,.12)}}
:where(button,.btn):not(:disabled):not(.leaflet-container *):active{scale:.97}
:where(a:not(.btn)){text-underline-offset:4px}
:focus-visible{outline:2px solid var(--mw-lagoon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.mw-share{min-height:44px;min-width:44px;padding:0 14px;border:2px solid var(--mw-ink);background:#fff;color:var(--mw-ink);font-family:Khand,Hind,system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:0;cursor:pointer}
.mw-share-float{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50}

/* Akiya Swipe: light top bar, Khand title, 44px targets, photo-top cards rounded 16 */
#top{background:#fff!important;color:var(--mw-ink)!important;border-bottom:1px solid var(--mw-line);box-shadow:none!important}
#top .brand{font-family:Khand,Hind,sans-serif!important;font-weight:700!important;font-size:20px!important;letter-spacing:.02em;color:var(--mw-ink)}
#top #progress{color:var(--mw-grey)!important}
#top .ib,#top .fbtn,#top button{background:#F5F5F5!important;color:var(--mw-ink)!important;border:1px solid var(--mw-line)!important}
.ib{min-width:44px!important;min-height:44px!important}
.pa,.pz{min-width:44px!important;min-height:44px!important}
#tipOk{min-height:44px!important;border-radius:0!important;font-family:Khand,Hind,sans-serif!important;font-weight:700!important;letter-spacing:.1em;text-transform:uppercase}
.card,#card{border-radius:16px}
.lnk{display:inline-flex!important;align-items:center;min-height:44px}

</style><!--/mw-polish-->
</head><body>
<header id="top">
  <a id="backDash" class="brand" href="https://webermanapps.github.io/jc-cc-e034959dac7d/" aria-label="Back to Japan Cottage dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Dashboard</a>
  <div id="progress"><b id="revN">0</b> of <b id="revT">0</b> reviewed</div>
  <button id="menuBtn" class="ib" aria-label="Menu">⋯</button>
</header>
<div id="tip" hidden></div>
<main>
  <section id="v-swipe" class="view on">
    <div id="deck" data-ptr-ignore></div>
    <div id="empty" hidden><p id="emptyMsg"></p><div id="submitBox"></div></div>
  </section>
  <section id="v-map" class="view" data-ptr-ignore><div id="map"></div><div id="sheet" hidden></div></section>
  <section id="v-list" class="view" data-ptr-ignore><div id="list"></div></section>
</main>
<div id="actions">
  <button id="bToss" class="act toss" aria-label="Toss">✕</button>
  <button id="bUndo" class="act undo" aria-label="Undo">↶</button>
  <button id="bKeep" class="act keep" aria-label="Keep">♥</button>
</div>
<nav id="tabs">
  <button class="tab on" data-v="swipe"><span>🃏</span>Swipe</button>
  <button class="tab" data-v="map"><span>🗺️</span>Map</button>
  <button class="tab" data-v="list"><span>♥</span>Kept <i id="keptN">0</i></button>
</nav>
<div id="menu" hidden data-ptr-ignore>
  <div class="mcard">
    <h3>Your list</h3>
    <div id="submitBoxMenu"></div>
    <p class="small">Decisions are saved on this device only (separate list per person / per phone).</p>
    <button id="mExport" class="mb">⬇ Export decisions (JSON)</button>
    <button id="mShare" class="mb" hidden>📤 Share decisions file…</button>
    <button id="mImport" class="mb">⬆ Import decisions…</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button id="mTip" class="mb">ℹ︎ How to install / use</button>
    <button id="mReset" class="mb warn">Reset my decisions…</button>
    <p class="small" id="about"></p>
    <button id="mClose" class="mb close">Close</button>
  </div>
</div>
<div id="viewer" hidden data-ptr-ignore><div id="vcar"></div><div id="vcount"></div><button id="vclose" class="ib" aria-label="Close">✕</button></div>
<div id="toast"></div>
<script src="vendor/leaflet.js?v=e5567e7698"></script>
<script src="ptr.js?v=e5567e7698" defer></script>
<script src="submit.js?v=e5567e7698"></script>
<script src="app.js?v=e5567e7698"></script>
</body></html>
